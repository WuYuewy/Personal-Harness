name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra ui --dev
      - run: uv run --locked python scripts/audit_release.py
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked python scripts/build_docs.py --check
      - run: uv run --locked --extra ui pytest
      - run: uv build
      - run: uv run --locked python scripts/smoke_wheel.py
      - run: uv run --locked python scripts/smoke_wheel.py --ui
